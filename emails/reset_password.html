<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>reset your password · subroutine</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&amp;family=Lexend:wght@400;500;600&amp;display=swap" />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #fafafa;
      color: #171717;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    ">
    <table
      role="presentation"
      width="100%"
      border="0"
      cellpadding="0"
      cellspacing="0"
      bgcolor="#fafafa"
      style="width: 100%; border-collapse: collapse">
      <tr>
        <td align="center" style="padding: 48px 16px">
          <!--[if mso]><table role="presentation" width="480" border="0" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
          <table
            role="presentation"
            width="480"
            height="400"
            border="0"
            cellpadding="0"
            cellspacing="0"
            bgcolor="#ffffff"
            style="
              width: 100%;
              max-width: 480px;
              height: 400px;
              table-layout: fixed;
              border: 1px solid #e5e5e5;
              background-color: #ffffff;
            ">
            <tr>
              <td valign="top" style="padding: 32px 32px 0">
                <p
                  style="
                    margin: 0;
                    font-family: &quot;Lexend&quot;, Arial, sans-serif;
                    font-size: 23px;
                    line-height: 30px;
                    font-weight: 500;
                    color: #171717;
                  ">
                  subroutine
                </p>
              </td>
            </tr>
            <tr>
              <td valign="top" style="padding: 32px 32px 28px">
                <h1
                  style="
                    margin: 0 0 14px;
                    font-family: &quot;Lexend&quot;, Arial, sans-serif;
                    font-size: 22px;
                    line-height: 30px;
                    font-weight: 500;
                    letter-spacing: -0.4px;
                    color: #171717;
                  ">
                  reset your password
                </h1>
                <p
                  style="
                    margin: 0 0 24px;
                    overflow-wrap: anywhere;
                    word-wrap: break-word;
                    font-family: &quot;Lexend&quot;, Arial, sans-serif;
                    font-size: 15px;
                    line-height: 25px;
                    color: #525252;
                  ">
                  use the button below to choose a new password for your subroutine account.
                </p>
                <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      align="center"
                      bgcolor="#171717"
                      style="background-color: #171717; mso-padding-alt: 12px 20px">
                      <a
                        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset-password"
                        style="
                          display: inline-block;
                          border: 1px solid #171717;
                          padding: 12px 20px;
                          font-family: &quot;Lexend&quot;, Arial, sans-serif;
                          font-size: 14px;
                          line-height: 20px;
                          font-weight: 500;
                          color: #ffffff;
                          text-decoration: none;
                        "
                        >reset password</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td valign="bottom" style="padding: 0 32px 28px">
                <table
                  role="presentation"
                  width="100%"
                  border="0"
                  cellpadding="0"
                  cellspacing="0"
                  style="width: 100%">
                  <tr>
                    <td style="border-top: 1px solid #e5e5e5; padding-top: 20px">
                      <p
                        style="
                          margin: 0;
                          font-family: &quot;Lexend&quot;, Arial, sans-serif;
                          font-size: 12px;
                          line-height: 20px;
                          color: #737373;
                        ">
                        if you didn&#x27;t request a password reset, you can ignore this email.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
